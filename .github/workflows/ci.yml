name: Cookiecutter Test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  template-tests:
    name: Template Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install test dependencies
        run: uv sync --group tests

      - name: Run template tests
        run: uv run pytest tests/ -v

  generated-project-tests:
    name: Generated Project Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Create new project
        run: |
          uvx cookiecutter . --no-input
          cd complexity
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"

      - name: Sync project with tests deps
        working-directory: complexity
        run: |
          uv lock
          uv sync --group tests --group lint --locked

      - name: Cache pre-commit
        id: precommit-cache
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/pre-commit/
          key: pre-commit|${{ runner.os }}|${{ runner.arch }}|${{ hashFiles('complexity/.pre-commit-config.yaml', 'complexity/pyproject.toml', 'complexity/uv.lock') }}
          restore-keys: |
            pre-commit|${{ runner.os }}|${{ runner.arch }}|

      - name: Run lint
        working-directory: complexity
        run: make lint

      - name: Run test
        working-directory: complexity
        run: make test-all

  auto_merge_deps:
    name: Auto Merge dependencies labeled PRs
    needs: [template-tests, generated-project-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Eligibility is read from the API, not from github.event.pull_request:
      # Renovate labels the PR a second *after* opening it, so the "opened"
      # payload snapshot can still show no labels (and "labeled" does not
      # re-trigger CI).
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          title=$(gh pr view "$PR_URL" --json title --jq .title)
          labels=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | join(" ")')
          echo "title=$title"
          echo "labels=$labels"
          if [[ " $labels " == *" dependencies "* ]] ||
             [[ "$title" == "build(pre-commit): update hooks"* ]]; then
            gh pr merge --auto --squash --delete-branch "$PR_URL"
          else
            echo "Not a dependency update; leaving PR open."
          fi
